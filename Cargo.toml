[package]
name = "lynpdf-rs"
version = "0.1.1"
edition = "2021"
authors = ["Supphachoke Suntiwichaya <mrchoke@gmail.com>"]
description = "Pure Rust HTML/CSS to PDF renderer focused on Thai text layout"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mrchoke/lynpdf-rs"
homepage = "https://github.com/mrchoke/lynpdf-rs"
documentation = "https://mrchoke.github.io/lynpdf-rs/"
keywords = ["pdf", "html", "thai", "renderer"]
categories = ["rendering", "text-processing"]
exclude = [
	"fonts/**",
	"tests/output/**",
	"examples/output/**",
	"tmp/**",
	"target/**",
]

[lib]
name = "lynpdf_rs"
path = "src/lib.rs"

[[bin]]
name = "lynpdf-rs"
path = "src/main.rs"

[dependencies]
html5ever = "0.38"
markup5ever_rcdom = "0.38"
lightningcss = "1.0.0-alpha.68"
rustybuzz = "0.20"
ttf-parser = "0.25"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
pulldown-cmark = "0.13"
syntect = "5.2"

# Kept as architecture dependencies for the next layout/text backend steps.
# The MVP uses a compact block layout and direct rustybuzz shaping so the crate
# can start producing PDFs before full CSS layout parity is implemented.
taffy = { version = "0.10", optional = true }
cosmic-text = { version = "0.19", default-features = false, optional = true }

[features]
default = []
layout-taffy = ["dep:taffy"]
text-cosmic = ["dep:cosmic-text"]

[dev-dependencies]
tempfile = "3"